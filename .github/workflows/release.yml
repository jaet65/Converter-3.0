name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Build application
        run: python build.py

        # Esto toma el contenido de dist/TrackSIM_Tools y crea el archivo TrackSIMTools.zip en la raíz de dist/
      - name: Compress Directory to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TrackSIM_Tools -DestinationPath dist/TrackSIMTools.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $currentVersion = "${{ github.ref_name }}".TrimStart('v')
          $previousTag = gh release list --limit 20 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | Where-Object { $_ -ne "${{ github.ref_name }}" } | Select-Object -First 1
          $assets = @("dist/TrackSIMTools.zip")
          if ($previousTag) {
            New-Item -ItemType Directory -Force -Path previous | Out-Null
            gh release download $previousTag --pattern TrackSIMTools.zip --dir previous
            $previousVersion = $previousTag.TrimStart('v')
            python create_incremental_update.py "previous/TrackSIMTools.zip" "dist/TrackSIMTools.zip" "dist/TrackSIMTools-$previousVersion-to-$currentVersion.zip" $previousVersion $currentVersion
            $assets += "dist/TrackSIMTools-$previousVersion-to-$currentVersion.zip"
          }
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "Release for version ${{ github.ref_name }}" $assets
